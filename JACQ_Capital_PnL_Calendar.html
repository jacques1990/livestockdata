<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACQ Capital P&amp;L Calendar</title><style>.weekly{display:block!important;margin-top:4px;padding-top:5px;border-top:1px solid #3a4352;color:#f1c868!important;font-size:10px!important;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
:root{color-scheme:dark;--bg:#070b14;--panel:#0d1320;--line:#1d2738;--muted:#778195;--gold:#e6b94f;--green:#3ce58b;--red:#ff5e67}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 48% 0,#101829 0,#070b14 38%);color:#eef2f8;font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}.app{min-height:100vh;padding:22px 24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #151e2c;padding-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:750}.brand i{width:4px;height:26px;border-radius:4px;background:#4da3ff}.badge{font-size:11px;color:#eacb7a;background:#302b22;border:1px solid #51452b;padding:7px 12px;border-radius:9px;text-transform:uppercase}.net small,.stat small{color:var(--muted);font-size:12px}.net{display:flex;gap:14px;align-items:baseline}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin:18px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}.stat{background:#0b111c;padding:12px 16px;display:flex;flex-direction:column;gap:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:9px 0 17px}.month{display:flex;align-items:center;gap:12px}.month h1{min-width:190px;text-align:center;font-size:17px}.btn{border:1px solid var(--line);background:#0d1421;border-radius:9px;height:38px;padding:0 13px;cursor:pointer}.gold{color:#f1c868;border-color:#493b20}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{height:32px;display:grid;place-items:center;color:#6f7889;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700}.day{position:relative;min-height:112px;padding:13px 11px;text-align:left;border:1px solid #121a27;background:linear-gradient(145deg,#0c121d,#0a0f19);border-radius:11px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}.day:hover{border-color:#334159}.day.blank{opacity:.25;cursor:default}.day.gain{border-color:#285338;background:linear-gradient(145deg,#0d1b18,#0a1415)}.day.loss{border-color:#552d36;background:linear-gradient(145deg,#1a1118,#110e16)}.num{position:absolute;top:10px;right:11px;font-size:12px;color:#6f7785}.day em{align-self:flex-start;padding:3px 6px;border-radius:4px;font-size:9px;font-style:normal;font-weight:800;text-transform:uppercase;background:#252d3b;color:#aab3c3}.day em.funded{background:#493813;color:#ffd66b}.day small{color:#707989;font-size:10px}.pos{color:var(--green)!important}.neg{color:var(--red)!important}.editor{min-height:400px;border:1px solid var(--line);border-radius:13px;background:#0c121df0;padding:19px;position:sticky;top:16px}.editorhead{display:flex;justify-content:space-between}.editor h2{margin:4px 0 12px;font-size:19px}.close{border:0;background:transparent;font-size:24px;cursor:pointer}.editor label{display:flex;flex-direction:column;gap:6px;margin:11px 0;color:#9ca6b8;font-size:11px;font-weight:650}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;background:#080e17;border:1px solid #263247;border-radius:8px;padding:9px 10px}textarea{resize:vertical}.save{width:100%;height:42px;border:1px solid #4b3a16;background:#2b2214;color:#f4cd6d;border-radius:9px;cursor:pointer}.emptymsg{min-height:350px;display:grid;place-items:center;text-align:center;color:#758094}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:11px;color:#8190a5;text-align:center;min-height:16px}@media(max-width:980px){.workspace{grid-template-columns:1fr}.editor{position:static}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{padding:14px 10px}.badge{display:none}.stats{grid-template-columns:repeat(2,1fr)}.calendar{gap:3px}.day{min-height:76px;padding:8px 5px}.day small{display:none}.toolbar{align-items:flex-start;gap:10px}.actions{justify-content:flex-end}.month h1{min-width:110px;font-size:14px}.pair{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div class="brand"><i></i>JACQ Capital <span class="badge">P&amp;L Calendar</span></div><div class="net"><small>Monthly net</small><strong id="net"></strong></div></header><section class="stats"><div class="stat"><small>Gross P&amp;L</small><strong id="gross"></strong></div><div class="stat"><small>Fees</small><strong id="fees" class="neg"></strong></div><div class="stat"><small>Trades</small><strong id="trades"></strong></div><div class="stat"><small>Green / red days</small><strong id="days"></strong></div><div class="stat"><small>Consistency</small><strong id="consistency"></strong></div></section><section class="toolbar"><div class="month"><button class="btn" id="prev">‹</button><h1 id="label"></h1><button class="btn" id="next">›</button></div><div class="actions"><button class="btn" id="export">Export JSON</button><button class="btn" id="import">Import JSON</button><input id="file" type="file" accept="application/json" hidden><button class="btn gold" id="add">＋ Add trade day</button></div></section><div class="workspace"><section class="calendar" id="calendar"></section><aside class="editor" id="editor"><div class="emptymsg"><div><h2>Select a date</h2><p>Click any day to add or edit its saved trading result.</p></div></div></aside></div></main><script>
const KEY='jacq-pnl-calendar-v1';const seed=[['2026-08-07','Evaluation',-16.88,6,-22.88,22,.5909,'Rapid re-entry after losses erased the opening edge.'],['2026-08-09','Evaluation',390.06,557.5,-167.44,21,.619,'Strong entries; 10-MNQ sizing created excessive drawdown.'],['2026-08-10','Evaluation',156.26,188.5,-32.24,4,1,'Excellent selectivity: four trades, all profitable.'],['2026-08-12','Evaluation',-998.64,-982,-16.64,3,0,'CPI-time trading produced the main loss. Avoid major releases.'],['2026-08-14','Evaluation',-123.7,-89.5,-34.2,6,.5,'Morning chop caused the main loss; late trades recovered part of it.'],['2026-08-16','Evaluation',60.1,261.5,-201.4,14,.7143,'Fees consumed most of the edge. Stop after reaching the target.'],['2026-08-17','Evaluation',325.49,511,-185.51,12,.917,'Strong profitable scalping session; first day trading Gold.'],['2026-08-21','Evaluation',202.9,343.5,-140.6,20,.7,'Protect the green day; avoid scaling marginal late setups.'],['2026-08-23','Evaluation',222.1,423.5,-201.4,24,.5833,'Volume profile showed promise, but confidence caused overtrading.'],['2026-08-24','Evaluation',-73.8,72.5,-146.3,15,.6667,'High win rate did not overcome fees and clustered losses.'],['2026-08-25','Evaluation',389.02,597.5,-208.48,23,.7391,'Desktop Asia-session execution improved after an accidental trade.'],['2026-08-27','Funded',239.88,397,-157.12,12,.8333,'New funded account — Day 1. Ten wins, one loss, one breakeven.'],['2026-08-28','Funded',180.6,363,-182.4,15,.6,'Funded Day 2. Oversizing and a large drawdown require tighter risk.']].map(x=>({tradeDate:x[0],stage:x[1],netPnl:x[2],grossPnl:x[3],fees:x[4],trades:x[5],winRate:x[6],notes:x[7]}));let entries=JSON.parse(localStorage.getItem(KEY)||'null')||seed,cursor=new Date(2026,7,1),selected=null;const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',signDisplay:'exceptZero'}).format(v),iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),prefix=`${y}-${String(m+1).padStart(2,'0')}`,month=entries.filter(e=>e.tradeDate.startsWith(prefix)),net=month.reduce((s,e)=>s+e.netPnl,0),gross=month.reduce((s,e)=>s+e.grossPnl,0),fees=month.reduce((s,e)=>s+e.fees,0),trades=month.reduce((s,e)=>s+e.trades,0),green=month.filter(e=>e.netPnl>0).length,red=month.filter(e=>e.netPnl<0).length,pos=month.reduce((s,e)=>s+Math.max(0,e.netPnl),0),best=Math.max(0,...month.map(e=>e.netPnl));$('label').textContent=cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'});$('net').textContent=money(net);$('net').className=net>=0?'pos':'neg';$('gross').textContent=money(gross);$('fees').textContent=money(fees);$('trades').textContent=trades;$('days').innerHTML=`<b class="pos">${green}</b> / <b class="neg">${red}</b>`;$('consistency').textContent=(pos?best/pos*100:0).toFixed(0)+'%';const cal=$('calendar');cal.innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();for(let i=0;i<42;i++){const d=i-first+1;if(d<1||d>count){cal.insertAdjacentHTML('beforeend','<div class="day blank"></div>');continue}const date=iso(y,m,d),e=entries.find(x=>x.tradeDate===date),b=document.createElement('button');b.className='day '+(e?(e.netPnl>=0?'gain':'loss'):'');b.innerHTML=`<span class="num">${d}</span>${e?`<em class="${e.stage.toLowerCase()}">${e.stage}</em><strong class="${e.netPnl>=0?'pos':'neg'}">${money(e.netPnl)}</strong><small>${e.trades} trades · ${(e.winRate*100).toFixed(1)}% wins</small>`:''}`;b.onclick=()=>openDay(date);cal.appendChild(b)}}function openDay(date){selected=entries.find(e=>e.tradeDate===date)||{tradeDate:date,stage:'Funded',netPnl:0,grossPnl:0,fees:0,trades:0,winRate:0,notes:''};$('editor').innerHTML=`<form id="form"><div class="editorhead"><div><small>Daily record</small><h2>${selected.tradeDate}</h2></div><button type="button" class="close" id="close">×</button></div><label>Account stage<select id="stage"><option>Evaluation</option><option>Funded</option></select></label><div class="pair"><label>Net P&amp;L<input id="np" type="number" step=".01" value="${selected.netPnl}"></label><label>Gross P&amp;L<input id="gp" type="number" step=".01" value="${selected.grossPnl}"></label></div><div class="pair"><label>Fees<input id="fee" type="number" step=".01" value="${selected.fees}"></label><label>Trades<input id="tc" type="number" min="0" value="${selected.trades}"></label></div><label>Win rate (%)<input id="wr" type="number" min="0" max="100" step=".1" value="${(selected.winRate*100).toFixed(1)}"></label><label>Notes<textarea id="notes" rows="5"></textarea></label><button class="save">Save day</button><p class="notice" id="notice"></p></form>`;$('stage').value=selected.stage;$('notes').value=selected.notes;$('close').onclick=()=>{$('editor').innerHTML='<div class="emptymsg"><div><h2>Select a date</h2><p>Click any day to add or edit its saved trading result.</p></div></div>'};$('form').onsubmit=e=>{e.preventDefault();selected={tradeDate:selected.tradeDate,stage:$('stage').value,netPnl:+$('np').value,grossPnl:+$('gp').value,fees:+$('fee').value,trades:+$('tc').value,winRate:+$('wr').value/100,notes:$('notes').value};entries=[...entries.filter(e=>e.tradeDate!==selected.tradeDate),selected].sort((a,b)=>a.tradeDate.localeCompare(b.tradeDate));persist();render();$('notice').textContent='Saved in this browser'}}$('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};$('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};$('add').onclick=()=>openDay(iso(cursor.getFullYear(),cursor.getMonth(),1));$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}));a.download='JACQ_PnL_Backup.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw 0;entries=data;persist();render();alert('Journal data imported.')}catch{alert('That JSON file is not a valid JACQ calendar backup.')}};render();
</script><script>
function addWeeklyTotals(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),buttons=[...document.querySelectorAll('#calendar .day:not(.blank)')];buttons.forEach((b,index)=>{const d=index+1,date=new Date(y,m,d);if(date.getDay()!==6)return;const start=new Date(y,m,d-6),startIso=iso(start.getFullYear(),start.getMonth(),start.getDate()),endIso=iso(y,m,d),total=entries.filter(e=>e.tradeDate>=startIso&&e.tradeDate<=endIso).reduce((sum,e)=>sum+Number(e.netPnl||0),0),line=document.createElement('small');line.className='weekly '+(total>=0?'pos':'neg');line.textContent='Week total '+money(total);b.appendChild(line)})}
const originalRender=render;render=function(){originalRender();addWeeklyTotals()};render();
</script></body></html>
